<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>main.Novel co-creation</title>
    <link rel="stylesheet" href="style.css">
    <style>
        header {
            width: 100%;
            padding: 30px 0 10px 0;
            text-align: center;
        }

        .user-info {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 16px 32px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.15);
        }
        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #fff;
            margin-right: 20px;
            object-fit: cover;
        }
        .user-meta {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .user-meta span {
            font-size: 16px;
        }

        .section {
            width: 90%;
            max-width: 900px;
            margin: 20px auto;
            background: rgba(255,255,255,0.10);
            border-radius: 10px;
            padding: 20px 30px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.12);
        }
        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #ffe4b5;
        }
        ul.novel-list {
            list-style: none;
            padding: 0;
        }
        ul.novel-list li {
            margin-bottom: 10px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        ul.novel-list li:last-child {
            border-bottom: none;
        }
        .novel-title {
            font-size: 16px;
            font-weight: bold;
        }
        .novel-meta {
            font-size: 13px;
            color: #ffd700;
        }
        .history-list {
            font-size: 14px;
            color: #fff8dc;
        }
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            padding: 10px 0 0 0;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="btn" onclick="location.href='start.html'">返回</button>
    </div>
    <header>
        <h1>网络小说共创平台</h1>
        <p style="color:#ffe4b5;">欢迎来到你的小说管理主页</p>
    </header>

    <div class="user-info">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=User" alt="头像" class="user-avatar" />
        <div class="user-meta">
            <span>用户名：<b>示例用户</b></span>
            <span>已参与小说：<b>3</b> 本</span>
            <span>已写节点：<b>12</b> 个</span>
        </div>
    </div>

    <div class="section">
        <div class="section-title">最近更新的小说</div>
        <ul class="novel-list">
            <li>
                <span class="novel-title">《天道共修》</span>
                <span class="novel-meta">更新于 2 小时前</span>
                <button class="btn">查看</button>
            </li>
            <li>
                <span class="novel-title">《星际漂流》</span>
                <span class="novel-meta">更新于 1 天前</span>
                <button class="btn">查看</button>
            </li>
        </ul>
    </div>

    <div class="section">
        <div class="section-title">我的小说节点历史</div>
        <ul class="history-list">
            <li>2025-09-10 《天道共修》- 第5章 新节点</li>
            <li>2025-09-08 《星际漂流》- 第2章 分支</li>
        </ul>
    </div>

    <div class="section">
        <div class="section-title">所有小说列表</div>
        <ul class="novel-list">
            <li>
                <span class="novel-title">《天道共修》</span>
                <button class="btn">进入</button>
            </li>
            <li>
                <span class="novel-title">《星际漂流》</span>
                <button class="btn">进入</button>
            </li>
            <li>
                <span class="novel-title">《修仙聊天室》</span>
                <button class="btn">进入</button>
            </li>
        </ul>
    </div>
</body>
</html>
